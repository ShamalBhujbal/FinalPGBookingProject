server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/pgfinder_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=604800000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# REPLACE 'root' WITH YOUR REAL GMAIL ADDRESS (e.g. user@gmail.com)
spring.mail.username=${MAIL_USERNAME}
# REPLACE 'cdac' WITH YOUR GMAIL APP PASSWORD (generate from Google Account > Security > App Passwords)
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
